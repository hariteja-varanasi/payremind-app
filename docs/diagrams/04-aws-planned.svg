<text class="el el-edge" x="930" y="72" text-anchor="middle">outbound via task public IP, no NAT gateway</text>
<text class="el el-edge" x="842" y="196" text-anchor="end">TLS</text>
<text class="el el-edge" x="750" y="470" text-anchor="start">reads secrets</text>
<text class="tx tx-banner" x="220" y="62" text-anchor="start">TERRAFORM WRITTEN · NOT APPLIED YET</text>
<text class="tx tx-band" x="230" y="478" text-anchor="start">Security and operations (account-wide)</text>
<text class="tx tx-note" x="230" y="440" text-anchor="start">Only CloudFront is public. App tasks accept traffic from the load balancer only;</text>
<text class="tx tx-note" x="230" y="455" text-anchor="start">the database has no internet route at all.</text>
