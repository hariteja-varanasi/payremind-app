<text class="nt" x="1005" y="522" text-anchor="middle">S3</text>
<text class="ns" x="1005" y="538" text-anchor="middle">ALB + trail logs</text>
<text class="el el-edge" x="176" y="352" text-anchor="start">HTTPS</text>
<text class="el el-edge" x="418" y="188" text-anchor="middle">HTTPS +</text>
