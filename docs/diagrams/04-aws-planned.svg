<text class="nt" x="742.5" y="335.5" text-anchor="middle">Fargate: daily job</text>
<text class="ns" x="742.5" y="351.5" text-anchor="middle">one-off task</text>
<text class="ns" x="742.5" y="366.5" text-anchor="middle">run-reminders</text>
