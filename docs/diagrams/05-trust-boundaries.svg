<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580" role="img" aria-label="Trust boundaries">
<style>
.canvas{fill:#ffffff}
text{font-family:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1d2733}
.nt{font-size:13px;font-weight:600}
.nt.mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12px}
.ns{font-size:11px;fill:#5b6878}
.n{stroke-width:1.4}
.n-core{fill:#e3f3ef;stroke:#0f766e}
.n-ext{fill:#f2f4f7;stroke:#64748b}
.n-person{fill:#fff5e0;stroke:#b7791f}
.n-plan{fill:#edf3ff;stroke:#3b6fd8;stroke-dasharray:5 3}
.z{fill:#f7f9fb;stroke:#9aa8b8;stroke-width:1;stroke-dasharray:4 4}
.z-plan{fill:none;stroke:#3b6fd8;stroke-width:1.4}
.z-warn{stroke:#c2410c}
.zl{font-size:12px;font-weight:600;fill:#5b6878;letter-spacing:.02em}
.zl-plan{fill:#3b6fd8}
.zl-warn{fill:#c2410c}
.e{fill:none;stroke:#4b5868;stroke-width:1.4}
.e-money{stroke:#15803d;stroke-width:2.2}
.e-warn{stroke:#c2410c}
.dash{stroke-dasharray:5 4}
.ah{fill:#4b5868}
.ah-money{fill:#15803d}
.ah-warn{fill:#c2410c}
.el{font-size:11px;fill:#1d2733;paint-order:stroke;stroke:#ffffff;stroke-width:4px;
stroke-linejoin:round}
.el-money{fill:#15803d;font-weight:600}
.el-warn{fill:#c2410c;font-weight:600}
.badge{fill:#1d2733}
.badge-t{font-size:11px;font-weight:700;fill:#ffffff}
.tx-band{font-size:12px;font-weight:600;fill:#5b6878;letter-spacing:.03em}
.tx-note{font-size:12px;fill:#5b6878}
.tx-banner{font-size:13px;font-weight:700;fill:#3b6fd8;letter-spacing:.08em}
.tx-warnnote{font-size:11px;fill:#c2410c}
</style>
<defs>
<marker id="a05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="m05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-money" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="w05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="0" y="0" width="1140" height="580"/>
<rect class="z z-warn" x="20" y="20" width="250" height="350" rx="10"/>
<text class="zl zl-warn" x="34" y="42">Internet (untrusted)</text>
<rect class="z z-zone" x="20" y="390" width="250" height="170" rx="10"/>
<text class="zl zl-zone" x="34" y="412">Third parties (signed)</text>
<rect class="z z-zone" x="470" y="20" width="300" height="540" rx="10"/>
<text class="zl zl-zone" x="484" y="42">PayRemind app</text>
<rect class="z z-zone" x="900" y="20" width="220" height="540" rx="10"/>
<text class="zl zl-zone" x="914" y="42">Data and secrets</text>
<polyline class="e e-edge" points="245,100 495,100" marker-end="url(#a05)"/>
<polyline class="e e-edge" points="245,200 495,200" marker-end="url(#a05)"/>
<polyline class="e e-edge" points="245,300 495,300" marker-end="url(#a05)"/>
<polyline class="e e-edge" points="245,450 380,450 380,470 495,470" marker-end="url(#a05)"/>
<polyline class="e e-edge" points="245,515 380,515 380,495 495,495" marker-end="url(#a05)"/>
<polyline class="e e-edge" points="745,175 925,175" marker-end="url(#a05)"/>
<polyline class="e e-edge dash" points="925,385 772,385" marker-end="url(#a05)"/>
<rect class="n n-person" x="45" y="70" width="200" height="60" rx="22"/>
<text class="nt" x="145" y="103.5" text-anchor="middle">Merchant browser</text>
<rect class="n n-person" x="45" y="170" width="200" height="60" rx="22"/>
<text class="nt" x="145" y="203.5" text-anchor="middle">Script / curl</text>
<rect class="n n-person" x="45" y="270" width="200" height="60" rx="22"/>
<text class="nt" x="145" y="303.5" text-anchor="middle">Customer phone</text>
<rect class="n n-ext" x="45" y="425" width="200" height="50" rx="8"/>
<text class="nt" x="145" y="453.5" text-anchor="middle">Meta (WhatsApp)</text>
<rect class="n n-ext" x="45" y="490" width="200" height="50" rx="8"/>
<text class="nt" x="145" y="518.5" text-anchor="middle">Razorpay</text>
<rect class="n n-core" x="495" y="70" width="250" height="60" rx="8"/>
<text class="nt" x="620" y="96" text-anchor="middle">Dashboard</text>
<text class="ns" x="620" y="112" text-anchor="middle">/login, /app/*</text>
<rect class="n n-core" x="495" y="170" width="250" height="60" rx="8"/>
<text class="nt" x="620" y="196" text-anchor="middle">REST API</text>
<text class="ns" x="620" y="212" text-anchor="middle">/imports, /invoices, …</text>
<rect class="n n-core" x="495" y="270" width="250" height="60" rx="8"/>
<text class="nt" x="620" y="296" text-anchor="middle">Pay page</text>
<text class="ns" x="620" y="312" text-anchor="middle">/p/{token}</text>
<rect class="n n-core" x="495" y="440" width="250" height="80" rx="8"/>
<text class="nt" x="620" y="468.5" text-anchor="middle">Webhook handlers</text>
<text class="ns" x="620" y="484.5" text-anchor="middle">/webhooks/whatsapp</text>
<text class="ns" x="620" y="499.5" text-anchor="middle">/webhooks/razorpay</text>
<rect class="n n-ext" x="925" y="120" width="170" height="110" rx="8"/>
<text class="nt" x="1010" y="156" text-anchor="middle">PostgreSQL</text>
<text class="ns" x="1010" y="172" text-anchor="middle">tokens, codes and</text>
<text class="ns" x="1010" y="187" text-anchor="middle">sessions stored</text>
<text class="ns" x="1010" y="202" text-anchor="middle">only as hashes</text>
<rect class="n n-ext" x="925" y="340" width="170" height="90" rx="8"/>
<text class="nt" x="1010" y="373.5" text-anchor="middle">Secrets</text>
<text class="ns" x="1010" y="389.5" text-anchor="middle">API keys, signing</text>
<text class="ns" x="1010" y="404.5" text-anchor="middle">secrets, secret key</text>
<text class="el el-edge" x="370" y="82" text-anchor="middle">WhatsApp OTP → session</text>
<text class="el el-edge" x="370" y="96" text-anchor="middle">cookie + CSRF token</text>
<text class="el el-edge" x="370" y="182" text-anchor="middle">Bearer API token</text>
<text class="el el-edge" x="370" y="196" text-anchor="middle">(SHA-256 hash stored)</text>
<text class="el el-edge" x="370" y="282" text-anchor="middle">random 24-byte pay token</text>
<text class="el el-edge" x="370" y="296" text-anchor="middle">no login, read-only</text>
<text class="el el-edge" x="380" y="425" text-anchor="middle">HMAC-SHA256</text>
<text class="el el-edge" x="380" y="439" text-anchor="middle">signature</text>
<text class="el el-edge" x="380" y="535" text-anchor="middle">HMAC signature,</text>
<text class="el el-edge" x="380" y="549" text-anchor="middle">event id used once</text>
<text class="el el-edge" x="835" y="157" text-anchor="middle">tenant_id filter on</text>
<text class="el el-edge" x="835" y="171" text-anchor="middle">every query</text>
<text class="el el-edge" x="848" y="377" text-anchor="middle">read at start-up</text>
</svg>
