<rect class="n n-person" x="140" y="37" width="112" height="58" rx="14"/>
<text class="nt" x="196" y="62" text-anchor="middle">Export list</text>
<text class="ns" x="196" y="78" text-anchor="middle">from Tally / Excel</text>
<circle class="badge" cx="140" cy="37" r="11"/>
<text class="badge-t" x="140" y="41" text-anchor="middle">1</text>
<rect class="n n-person" x="264" y="37" width="112" height="58" rx="14"/>
<text class="nt" x="320" y="62" text-anchor="middle">Upload file</text>
<text class="ns" x="320" y="78" text-anchor="middle">dashboard or API</text>
<circle class="badge" cx="264" cy="37" r="11"/>
<text class="badge-t" x="264" y="41" text-anchor="middle">2</text>
<rect class="n n-core" x="264" y="129" width="112" height="58" rx="8"/>
<text class="nt" x="320" y="154" text-anchor="middle">Parse &amp; check</text>
<text class="ns" x="320" y="170" text-anchor="middle">≤ 5 MB, ≤ 5,000 rows</text>
<circle class="badge" cx="264" cy="129" r="11"/>
<text class="badge-t" x="264" y="133" text-anchor="middle">3</text>
<rect class="n n-ext" x="388" y="221" width="112" height="58" rx="8"/>
<text class="nt" x="444" y="246" text-anchor="middle">Save invoices</text>
<text class="ns" x="444" y="262" text-anchor="middle">upsert by invoice no.</text>
<circle class="badge" cx="388" cy="221" r="11"/>
<text class="badge-t" x="388" y="225" text-anchor="middle">4</text>
<rect class="n n-core" x="512" y="129" width="112" height="58" rx="8"/>
<text class="nt" x="568" y="154" text-anchor="middle">Daily run</text>
<text class="ns" x="568" y="170" text-anchor="middle">09:30 IST</text>
<circle class="badge" cx="512" cy="129" r="11"/>
<text class="badge-t" x="512" y="133" text-anchor="middle">5</text>
<rect class="n n-plan" x="636" y="129" width="128" height="58" rx="8"/>
<text class="nt" x="700" y="146.5" text-anchor="middle">Skip if</text>
<text class="ns" x="700" y="162.5" text-anchor="middle">paid · STOP · no phone</text>
<text class="ns" x="700" y="177.5" text-anchor="middle">promise · billing lapsed</text>
<rect class="n n-ext" x="636" y="313" width="112" height="58" rx="8"/>
<text class="nt" x="692" y="338" text-anchor="middle">Send template</text>
<text class="ns" x="692" y="354" text-anchor="middle">name, invoice, ₹, link</text>
<circle class="badge" cx="636" cy="313" r="11"/>
<text class="badge-t" x="636" y="317" text-anchor="middle">6</text>
<rect class="n n-ext" x="636" y="221" width="112" height="58" rx="8"/>
<text class="nt" x="692" y="246" text-anchor="middle">Log reminder</text>
<text class="ns" x="692" y="262" text-anchor="middle">once per step</text>
<circle class="badge" cx="636" cy="221" r="11"/>
<text class="badge-t" x="636" y="225" text-anchor="middle">7</text>
<rect class="n n-person" x="760" y="405" width="112" height="58" rx="14"/>
