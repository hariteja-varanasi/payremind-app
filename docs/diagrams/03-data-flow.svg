<text class="ns" x="816" y="446" text-anchor="middle">/p/&lt;token&gt;</text>
<circle class="badge" cx="760" cy="405" r="11"/>
<text class="badge-t" x="760" y="409" text-anchor="middle">8</text>
<rect class="n n-core" x="884" y="129" width="112" height="58" rx="8"/>
<text class="nt" x="940" y="154" text-anchor="middle">Pay page</text>
<text class="ns" x="940" y="170" text-anchor="middle">amount, UPI QR</text>
<circle class="badge" cx="884" cy="129" r="11"/>
<text class="badge-t" x="884" y="133" text-anchor="middle">9</text>
<rect class="n n-person" x="884" y="405" width="112" height="58" rx="14"/>
<text class="nt" x="940" y="430" text-anchor="middle">Pay in UPI app</text>
<text class="ns" x="940" y="446" text-anchor="middle">GPay, PhonePe…</text>
<circle class="badge" cx="884" cy="405" r="11"/>
<text class="badge-t" x="884" y="409" text-anchor="middle">10</text>
<rect class="n n-ext" x="1008" y="497" width="112" height="58" rx="8"/>
<text class="nt" x="1064" y="522" text-anchor="middle">Money arrives</text>
<text class="ns" x="1064" y="538" text-anchor="middle">merchant&#x27;s account</text>
<circle class="badge" cx="1008" cy="497" r="11"/>
<text class="badge-t" x="1008" y="501" text-anchor="middle">11</text>
<rect class="n n-person" x="1132" y="37" width="112" height="58" rx="14"/>
<text class="nt" x="1188" y="62" text-anchor="middle">Mark paid</text>
<text class="ns" x="1188" y="78" text-anchor="middle">after checking bank</text>
<circle class="badge" cx="1132" cy="37" r="11"/>
<text class="badge-t" x="1132" y="41" text-anchor="middle">12</text>
<rect class="n n-ext" x="1132" y="221" width="112" height="58" rx="8"/>
<text class="nt" x="1188" y="246" text-anchor="middle">Invoice closed</text>
<text class="ns" x="1188" y="262" text-anchor="middle">reminders stop</text>
<circle class="badge" cx="1132" cy="221" r="11"/>
<text class="badge-t" x="1132" y="225" text-anchor="middle">13</text>
<text class="el el-edge" x="450" y="198" text-anchor="start">valid rows</text>
<text class="el el-edge" x="562" y="230" text-anchor="end">next morning</text>
<text class="el el-edge" x="610" y="302" text-anchor="start">if due</text>
<text class="el el-edge" x="698" y="301" text-anchor="start">message id</text>
<text class="el el-edge" x="698" y="424" text-anchor="start">delivers</text>
<text class="el el-edge" x="852" y="192" text-anchor="start">taps link</text>
<text class="el el-money" x="946" y="516" text-anchor="start">₹ direct</text>
<text class="el el-edge" x="1182" y="516" text-anchor="end">sees credit</text>
<text class="el el-edge" x="1224" y="171" text-anchor="end">closes</text>
<text class="tx tx-band" x="30" y="70" text-anchor="start">Merchant</text>
<text class="tx tx-band" x="30" y="162" text-anchor="start">PayRemind</text>
<text class="tx tx-band" x="30" y="254" text-anchor="start">Database</text>
<text class="tx tx-band" x="30" y="346" text-anchor="start">WhatsApp</text>
<text class="tx tx-band" x="30" y="438" text-anchor="start">Customer</text>
<text class="tx tx-band" x="30" y="530" text-anchor="start">Bank / UPI</text>
