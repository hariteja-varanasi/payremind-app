name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payremind
          POSTGRES_PASSWORD: payremind
          POSTGRES_DB: payremind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: bandit -q -r src
      - run: pip-audit --skip-editable
      - name: tests (SQLite)
        run: pytest
      - name: tests (Postgres)
        run: pytest --no-cov
        env:
          PAYREMIND_TEST_DATABASE_URL: postgresql+psycopg://payremind:payremind@localhost:5432/payremind_test

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov && checkov -d . --config-file .checkov.yaml
