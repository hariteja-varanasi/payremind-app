<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pay {{ payee }}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #1a1a1a; }
  .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
  .amount { font-size: 2rem; font-weight: 700; margin: 8px 0 16px; }
  .btn { display: block; text-align: center; background: #0b6b3a; color: #fff; padding: 14px;
         border-radius: 8px; text-decoration: none; font-weight: 600; }
  .qr { display: block; margin: 20px auto 8px; width: 220px; height: 220px; }
  .muted { color: #666; font-size: .9rem; text-align: center; }
  .paid { color: #0b6b3a; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div>{{ payee }}</div>
  <div class="muted" style="text-align:left">Invoice {{ number }} · due {{ due }}</div>
  {% if paid %}
    <p class="paid">This invoice is marked as paid. Thank you!</p>
  {% else %}
    <div class="amount">₹{{ amount }}</div>
    <a class="btn" href="{{ upi_link }}">Pay with any UPI app</a>
    <img class="qr" alt="UPI QR code" src="data:image/svg+xml;base64,{{ qr_b64 }}">
    <p class="muted">On a computer? Scan this QR with your UPI app.</p>
    <p class="muted">Payment goes directly to {{ payee }} ({{ vpa }}).</p>
  {% endif %}
</div>
</body>
</html>
