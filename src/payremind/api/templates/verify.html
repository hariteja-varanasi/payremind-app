{% extends "base.html" %}
{% block title %}Enter code · PayRemind{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h2>Enter your code</h2>
  <p class="muted">If {{ phone }} is registered, we've sent a 6-digit code on WhatsApp. It expires in 5 minutes.</p>
  <form method="post" action="/login/verify">
    <input type="hidden" name="phone" value="{{ phone }}">
    <label for="code">Code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p><a href="/login">Use a different number</a></p>
</div>
{% endblock %}
