{% extends "base.html" %}
{% block title %}Sign in · PayRemind{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h2>Sign in</h2>
  <form method="post" action="/login">
    <label for="phone">Your WhatsApp number</label>
    <input id="phone" name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="98450 12345">
    <p><button type="submit">Send me a code</button></p>
  </form>
  <p class="muted">PayRemind is invite-only during the beta.</p>
  {% if demo %}
  <form method="post" action="/login/demo">
    <p><button class="secondary" type="submit">Open the demo business (Sharma Distributors)</button></p>
  </form>
  {% endif %}
</div>
{% endblock %}
