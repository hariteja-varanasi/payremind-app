[project]
name = "payremind"
version = "0.1.0"
description = "WhatsApp-first payment reminders for Indian MSMEs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "openpyxl>=3.1",
  "python-multipart>=0.0.18",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "types-openpyxl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payremind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=payremind --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[project.scripts]
payremind = "payremind.cli:main"
